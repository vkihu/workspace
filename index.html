<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e7;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-area h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .logo-area p {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 1px;
    }
    #datetime {
      font-size: 13px;
      color: #6e6e73;
      text-align: right;
    }

    /* ── Search ── */
    .search-wrap {
      padding: 28px 40px 12px;
    }
    .search-inner {
      position: relative;
      max-width: 380px;
    }
    .search-inner svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #8e8e93;
      pointer-events: none;
    }
    input[type="search"] {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    input[type="search"]:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0,113,227,.12);
    }
    input[type="search"]::placeholder { color: #aeaeb2; }

    /* ── Main ── */
    main { padding: 8px 40px 48px; }

    .section { margin-bottom: 28px; }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 10px;
    }

    /* ── Grid & Cards ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 14px;
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 13px;
      transition: box-shadow .18s, transform .18s, border-color .18s;
    }
    .card:hover {
      box-shadow: 0 4px 18px rgba(0,0,0,.09);
      transform: translateY(-2px);
      border-color: #c7c7cc;
    }
    .card:active { transform: translateY(0); }

    .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      background: #f5f5f7;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .icon-wrap img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .card-text { flex: 1; min-width: 0; }
    .card-name {
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-desc {
      font-size: 11.5px;
      color: #8e8e93;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Empty state ── */
    #noResults {
      display: none;
      padding: 56px 0;
      text-align: center;
      color: #aeaeb2;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header, .search-wrap, main { padding-left: 20px; padding-right: 20px; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-area">
    <h1>My Workspace</h1>
    <p>Vickie's Portal</p>
  </div>
  <div id="datetime"></div>
</header>

<div class="search-wrap">
  <div class="search-inner">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.8"/>
      <path d="M13 13L17.5 17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <input type="search" id="searchInput" placeholder="搜尋工具或文件…" autocomplete="off">
  </div>
</div>

<main id="mainContent">

        </div>
        <div class="card-text">
          <div class="card-name">工時填寫</div>

      </a>

      <a class="card" href="https://dentsu.service-now.com/sp" target="_blank"

        </div>

  </section>

  <!-- 文件資源 -->
  <section class="section" data-section>
    <div class="section-label">文件資源</div>
    <div class="grid">

      <a class="card" href="https://tw.dentsu.pro/home" target="_blank"
         data-name="Dentsu Pro dentsu pro">
        <div class="icon-wrap">
          <img src="https://www.google.com/s2/favicons?domain=tw.dentsu.pro&sz=64" alt="Dentsu Pro"
               onerror="this.src='https://www.google.com/s2/favicons?domain=dentsu.com&sz=64'">
        </div>

          <div class="card-name">Dentsu Pro</div>

        </div>
      </a>

      <a class="card"
         href="https://globalappsportal.sharepoint.com/sites/taiwan-dentsupro/SitePages/%E9%9B%86%E5%9C%98%E8%BE%A6%E5%85%AC%E5%AE%A4%E4%BD%BF%E7%94%A8%E6%89%8B%E5%86%8A.aspx"
         target="_blank"
         data-name="集團辦公室手冊 sharepoint">
        <div class="icon-wrap">
          <img src="https://www.google.com/s2/favicons?domain=sharepoint.com&sz=64" alt="SharePoint">
        </div>
        <div class="card-text">
          <div class="card-name">集團辦公室手冊</div>
          <div class="card-desc">SharePoint 頁面</div>
        </div>
      </a>

      <a class="card"
         href="https://globalappsportal.sharepoint.com/:p:/s/HR-APAC-Taiwan-DANTWHR/EcZGpxeaVQdIjnI3Ao8Fo4QBWOydxmSay0x2kZekTUGbyQ?wdLOR=cF4F87711-51D9-4672-8F4B-754FD5448551&CID=b04389a1-3ae7-4a03-804a-713328272b86"
         target="_blank"
         data-name="新人入職介紹 sharepoint hr onboarding">
        <div class="icon-wrap">
          <img src="https://www.google.com/s2/favicons?domain=sharepoint.com&sz=64" alt="SharePoint">
        </div>

          <div class="card-name">新人入職介紹</div>

        </div>
      </a>

      <a class="card"
         href="https://globalappsportal.sharepoint.com/:p:/r/sites/CXProjectmanagementstandarddocuments/_layouts/15/Doc.aspx?action=edit&sourcedoc=%7B777dbff8-aa35-4852-931d-57862f48a946%7D&wdExp=TEAMS-TREATMENT&web=1&CID=87d85dfe-cbe1-4a62-bd6a-fabf0b5522a8"
         target="_blank"
         data-name="workbook cx 專案標準文件 project management">

    </div>
  </section>

  <!-- 溝通協作 -->
  <section class="section" data-section>
    <div class="section-label">溝通協作</div>
    <div class="grid">

      <a class="card"
         href="https://teams.microsoft.com/l/channel/19%3A860aa744a2354b738ad8b59be45258d4%40thread.tacv2/Operation%20guidance?groupId=6ec22004-0f83-47e6-964c-0404fae525f4&tenantId=6e8992ec-76d5-4ea5-8eae-b0c5e558749a"
         target="_blank"
         data-name="operation guidance teams 頻道 microsoft">
        <div class="icon-wrap">
          <img src="https://www.google.com/s2/favicons?domain=teams.microsoft.com&sz=64" alt="Teams">
        </div>
        <div class="card-text">

        </div>
      </a>

    </div>
  </section>

  <div id="noResults">找不到符合的工具 🔍</div>

</main>

<script>
  // 時間
  function updateTime() {
    const now = new Date();
    const date = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    const time = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
  }
  updateTime();
  setInterval(updateTime, 10000);

  // 搜尋
  document.getElementById('searchInput').addEventListener('input', function () {
    const q = this.value.toLowerCase().trim();
    const cards = document.querySelectorAll('.card');
    let visible = 0;

    cards.forEach(card => {
      const match = !q || (card.dataset.name || '').includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    });

    document.querySelectorAll('[data-section]').forEach(sec => {
      const any = [...sec.querySelectorAll('.card')].some(c => c.style.display !== 'none');
      sec.style.display = any ? '' : 'none';
    });

    document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
  });
</script>

</body>
</html>
